{% extends 'base.html' %}
{% block title %}{{ g.t.register }}{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="card">
        <h1>{{ g.t.register }}</h1>
        <form method="POST">
            <div class="form-group">
                <label>{{ g.t.name }}</label>
                <input type="text" name="name" required>
            </div>
            <div class="form-group">
                <label>{{ g.t.email }}</label>
                <input type="email" name="email" required placeholder="name@bisc.edu">
            </div>
            <div class="form-group">
                <label>{{ g.t.password }}</label>
                <input type="password" name="password" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary btn-block">{{ g.t.register_btn }}</button>
        </form>
        <p style="text-align:center; margin-top:16px; font-size:0.9rem;">
            {{ g.t.have_account }} <a href="{{ url_for('login') }}">{{ g.t.login }}</a>
        </p>
        <p style="text-align:center; font-size:0.8rem; color:var(--text-light); margin-top:8px;">
            {{ g.t.school_email_required }}
        </p>
    </div>
</div>
{% endblock %}
