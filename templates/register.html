{% extends 'base.html' %}
{% block title %}{{ g.t.register }}{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="card">
        <div class="auth-logo">
            <div class="brand-icon-lg"><i class="fas fa-user-plus"></i></div>
            <h1>{{ g.t.register }}</h1>
        </div>
        <form method="POST">
            <div class="form-group">
                <label><i class="fas fa-user" style="color:var(--gold);"></i> {{ g.t.name }}</label>
                <input type="text" name="name" required placeholder="Your full name">
            </div>
            <div class="form-group">
                <label><i class="fas fa-envelope" style="color:var(--gold);"></i> {{ g.t.email }}</label>
                <input type="email" name="email" required placeholder="name@bisc.edu.eg">
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock" style="color:var(--gold);"></i> {{ g.t.password }}</label>
                <input type="password" name="password" required minlength="6" placeholder="Minimum 6 characters">
            </div>
            <button type="submit" class="btn btn-accent btn-block btn-lg">{{ g.t.register_btn }}</button>
        </form>
        <div class="auth-divider">or</div>
        <p style="text-align:center; font-size:0.9rem; color:var(--text-light);">
            {{ g.t.have_account }} <a href="{{ url_for('login') }}" style="font-weight:700; color:var(--navy);">{{ g.t.login }}</a>
        </p>
        <p style="text-align:center; font-size:0.8rem; color:var(--text-muted); margin-top:12px;">
            <i class="fas fa-shield-alt" style="color:var(--gold);"></i> {{ g.t.school_email_required }}
        </p>
    </div>
</div>
{% endblock %}
