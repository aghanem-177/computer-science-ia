{% extends 'base.html' %}
{% block title %}{{ g.t.claim_this }}{% endblock %}
{% block content %}
<a href="{{ url_for('item_details', item_id=item.id) }}" style="display:inline-block; margin-bottom:16px;">&larr; {{ g.t.back }}</a>

<div class="card" style="max-width:700px;">
    <h1 style="margin-bottom:8px;">{{ g.t.claim_this }}</h1>
    <p style="color:var(--text-light); margin-bottom:20px;">{{ item.title }}</p>

    <form method="POST">
        <div class="form-group">
            <label>{{ g.t.claim_description }}</label>
            <textarea name="claim_description" rows="6" required
                placeholder="Describe identifying details: color, brand, marks, contents, when/where you lost it..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary">{{ g.t.submit }}</button>
        <a href="{{ url_for('item_details', item_id=item.id) }}" class="btn btn-outline" style="margin-left:8px;">{{ g.t.cancel }}</a>
    </form>
</div>
{% endblock %}
